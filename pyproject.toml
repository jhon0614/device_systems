[project]
name = "device-systems"
version = "0.1.0"
description = "API REST para la gestion y consulta de usuarios"
readme = "README.md"
authors = [
    { name = "Jhon Ricardo Rios Cuervo", email = "jhonri.0614@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
device-systems = "device_systems:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
